syntax = "proto3";

package kmgr.v1;

import "kmgr/v1/common.proto";

option go_package = "github.com/charlie0129/kmgr/gen/go/kmgr/v1;kmgrv1";
option swift_prefix = "Kmgr_V1_";

service ClusterService {
  rpc ListContexts(ListContextsRequest) returns (ListContextsResponse);
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (Acknowledgement);
  rpc WatchConnection(WatchConnectionRequest) returns (stream ConnectionEvent);
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
}

message KubeconfigContext {
  string name = 1;
  string cluster_name = 2;
  string server_hostname = 3;
  string default_namespace = 4;
  repeated string source_paths = 5;
  bool current = 6;
  string authentication_hint = 7;
  bool authentication_supported = 8;
  StructuredError unsupported_authentication_error = 9;
  string context_id = 10;
}

message ListContextsRequest {
  RequestContext context = 1;
  bool reload = 2;
  repeated string kubeconfig_paths = 3;
}

message ListContextsResponse {
  string request_id = 1;
  repeated KubeconfigContext contexts = 2;
  StructuredError error = 3;
}

message OpenSessionRequest {
  RequestContext context = 1;
  string context_name = 2;
  repeated string kubeconfig_paths = 3;
}

message OpenSessionResponse {
  string request_id = 1;
  string cluster_session_id = 2;
  string context_name = 3;
  string cluster_name = 4;
  string server_hostname = 5;
  string default_namespace = 6;
  StructuredError error = 7;
}

message CloseSessionRequest {
  RequestContext context = 1;
  bool keep_independent_streams = 2;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_CONNECTING = 1;
  CONNECTION_STATE_CONNECTED = 2;
  CONNECTION_STATE_RECONNECTING = 3;
  CONNECTION_STATE_DISCONNECTED = 4;
  CONNECTION_STATE_FAILED = 5;
  CONNECTION_STATE_CLOSED = 6;
}

message WatchConnectionRequest {
  RequestContext context = 1;
  string stream_id = 2;
}

message ConnectionEvent {
  StreamCursor cursor = 1;
  ConnectionState state = 2;
  int64 observed_at_unix_ms = 3;
  StructuredError error = 4;
  // Monotonic, process-local Kubernetes API payload totals for this shared
  // cluster authority. They intentionally exclude kubeconfig contents and
  // expose counts only; the GUI derives short-window rates from deltas.
  uint64 api_bytes_received = 5;
  uint64 api_bytes_sent = 6;
  // Process-memory view-cache accounting. Retained totals include active and
  // idle raw stores plus their projected presentations. Evictable totals are
  // the idle warm subset governed by the reported limits. Neither record
  // includes cache keys, Kubernetes identities, selectors, or authority IDs.
  WarmCacheUsage authority_warm_cache = 7;
  WarmCacheUsage global_warm_cache = 8;
}

message WarmCacheUsage {
  // Total retained view-cache graph, including active views. These values are
  // informational and are not capped by the idle warm-cache limits below.
  uint64 retained_views = 1;
  uint64 retained_objects = 2;
  uint64 retained_bytes = 3;
  // Limits apply only to the evictable idle warm subset.
  uint64 view_limit = 4;
  uint64 object_limit = 5;
  uint64 byte_limit = 6;
  // Cumulative entries removed specifically to satisfy a warm-cache budget.
  // Normal consumption, explicit removal, and shutdown do not increment it.
  uint64 budget_evictions = 7;
  uint64 evictable_views = 8;
  uint64 evictable_objects = 9;
  uint64 evictable_bytes = 10;
}

message DiscoverRequest {
  RequestContext context = 1;
  bool refresh = 2;
}

message ApiResource {
  ResourceType type = 1;
  repeated string verbs = 2;
  repeated string short_names = 3;
  repeated string categories = 4;
  bool preferred_version = 5;
}

message DiscoverResponse {
  string request_id = 1;
  repeated ApiResource resources = 2;
  string discovery_revision = 3;
  StructuredError error = 4;
  // Partial discovery remains useful, but consumers must not assume this is a
  // complete catalog when potentially_incomplete is true. warning is safe to
  // display and contains no arbitrary Kubernetes response text.
  bool potentially_incomplete = 5;
  StructuredError warning = 6;
}

message ListNamespacesRequest { RequestContext context = 1; }

message ListNamespacesResponse {
  string request_id = 1;
  repeated string namespaces = 2;
  StructuredError error = 3;
}
