syntax = "proto3";

package kmgr.v1;

import "kmgr/v1/common.proto";

option go_package = "github.com/charlie0129/kmgr/gen/go/kmgr/v1;kmgrv1";
option swift_prefix = "Kmgr_V1_";

service ObjectService {
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
  rpc WatchObject(WatchObjectRequest) returns (stream ObjectEvent);
  rpc GetData(GetDataRequest) returns (GetDataResponse);
}

message GetObjectRequest {
  RequestContext context = 1;
  ResourceIdentity identity = 2;
  bool include_yaml = 3;
  bool include_summary = 4;
  bool include_metrics = 5;
}

message ObjectSummaryField {
  string section_id = 1;
  string field_id = 2;
  string label = 3;
  string display_text = 4;
  string tooltip = 5;
  CellSeverity severity = 6;
  // Structured timestamp kept separate from display_text so clients can
  // refresh relative time locally. Zero means Kubernetes did not publish a
  // valid timestamp for this field.
  int64 timestamp_unix_ms = 7;
  SummaryTimestampPresentation timestamp_presentation = 8;
}

// ObjectOwnerReference is the bounded owner metadata needed for parent
// navigation. It is returned as part of object detail, not through a separate
// relationship or child-scan API.
message ObjectOwnerReference {
  string group = 1;
  string version = 2;
  string kind = 3;
  string name = 4;
  string uid = 5;
  bool controller = 6;
}

enum PodContainerKind {
  POD_CONTAINER_KIND_UNSPECIFIED = 0;
  POD_CONTAINER_KIND_REGULAR = 1;
  POD_CONTAINER_KIND_INIT = 2;
  POD_CONTAINER_KIND_EPHEMERAL = 3;
}

// PodContainerDetail is a bounded, display-safe projection of one declared
// Pod container. It deliberately excludes images, environment variables, and
// the raw Pod object while retaining the fields needed by container actions.
message PodContainerDetail {
  string name = 1;
  PodContainerKind kind = 2;
  string status = 3;
  string status_tooltip = 4;
  CellSeverity status_severity = 5;
  bool ready = 6;
  int32 restart_count = 7;
  repeated string ports = 8;
  repeated ResourceUsageValue metrics = 9;
}

message GetObjectResponse {
  string request_id = 1;
  ResourceIdentity identity = 2;
  string resource_version = 3;
  bytes yaml_utf8 = 4;
  repeated ObjectSummaryField summary_fields = 5;
  repeated StringMapEntry labels = 6;
  repeated StringMapEntry annotations = 7;
  reserved 8;
  reserved "metrics";
  StructuredError error = 9;
  repeated PodContainerDetail containers = 10;
  // Canonical Kubernetes label selector for the Pods selected by this
  // workload, Service, or ReplicationController. Empty means no safe,
  // restrictive Pod selector is available; clients must not interpret it as
  // "all Pods".
  string pod_label_selector = 11;
  repeated ObjectOwnerReference owners = 12;
}

message WatchObjectRequest {
  RequestContext context = 1;
  string object_stream_id = 2;
  uint64 generation = 3;
  ResourceIdentity identity = 4;
  string resource_version = 5;
}

enum ObjectEventType {
  OBJECT_EVENT_TYPE_UNSPECIFIED = 0;
  OBJECT_EVENT_TYPE_UPDATED = 1;
  OBJECT_EVENT_TYPE_DELETED = 2;
  OBJECT_EVENT_TYPE_STATUS = 3;
}

message ObjectEvent {
  StreamCursor cursor = 1;
  ObjectEventType type = 2;
  GetObjectResponse object = 3;
  StructuredError error = 4;
}

enum DataEntryKind {
  DATA_ENTRY_KIND_UNSPECIFIED = 0;
  DATA_ENTRY_KIND_TEXT = 1;
  DATA_ENTRY_KIND_BINARY = 2;
}

enum SummaryTimestampPresentation {
  SUMMARY_TIMESTAMP_PRESENTATION_UNSPECIFIED = 0;
  SUMMARY_TIMESTAMP_PRESENTATION_ELAPSED_SINCE = 1;
  SUMMARY_TIMESTAMP_PRESENTATION_OCCURRED_AT = 2;
}

// value is intentionally bytes. For Secrets, Go decodes Kubernetes base64
// before sending and re-encodes on mutation. These messages are sensitive and
// must not be logged or persisted by either process.
message DataEntry {
  string key = 1;
  DataEntryKind kind = 2;
  bytes value = 3;
  uint64 byte_size = 4;
  bytes content_hash = 5;
}

message GetDataRequest {
  RequestContext context = 1;
  ResourceIdentity identity = 2;
}

message GetDataResponse {
  string request_id = 1;
  ResourceIdentity identity = 2;
  string resource_version = 3;
  repeated DataEntry entries = 4;
  bool secret = 5;
  StructuredError error = 6;
}
