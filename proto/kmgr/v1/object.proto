syntax = "proto3";

package kmgr.v1;

import "kmgr/v1/common.proto";

option go_package = "github.com/charlie0129/kmgr/gen/go/kmgr/v1;kmgrv1";
option swift_prefix = "Kmgr_V1_";

service ObjectService {
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
  rpc WatchObject(WatchObjectRequest) returns (stream ObjectEvent);
  rpc GetRelationships(GetRelationshipsRequest) returns (GetRelationshipsResponse);
  rpc ScanRelationships(ScanRelationshipsRequest) returns (stream RelationshipScanEvent);
  rpc CancelRelationshipScan(CancelRelationshipScanRequest) returns (Acknowledgement);
  rpc GetData(GetDataRequest) returns (GetDataResponse);
}

message GetObjectRequest {
  RequestContext context = 1;
  ResourceIdentity identity = 2;
  bool include_yaml = 3;
  bool include_summary = 4;
  bool include_metrics = 5;
}

message ObjectSummaryField {
  string section_id = 1;
  string field_id = 2;
  string label = 3;
  string display_text = 4;
  string tooltip = 5;
  CellSeverity severity = 6;
}

enum PodContainerKind {
  POD_CONTAINER_KIND_UNSPECIFIED = 0;
  POD_CONTAINER_KIND_REGULAR = 1;
  POD_CONTAINER_KIND_INIT = 2;
  POD_CONTAINER_KIND_EPHEMERAL = 3;
}

// PodContainerDetail is a bounded, display-safe projection of one declared
// Pod container. It deliberately excludes images, environment variables, and
// the raw Pod object while retaining the fields needed by container actions.
message PodContainerDetail {
  string name = 1;
  PodContainerKind kind = 2;
  string status = 3;
  string status_tooltip = 4;
  CellSeverity status_severity = 5;
  bool ready = 6;
  int32 restart_count = 7;
  repeated string ports = 8;
  repeated ResourceUsageValue metrics = 9;
}

message GetObjectResponse {
  string request_id = 1;
  ResourceIdentity identity = 2;
  string resource_version = 3;
  bytes yaml_utf8 = 4;
  repeated ObjectSummaryField summary_fields = 5;
  repeated StringMapEntry labels = 6;
  repeated StringMapEntry annotations = 7;
  repeated ResourceUsageValue metrics = 8;
  StructuredError error = 9;
  repeated PodContainerDetail containers = 10;
}

message WatchObjectRequest {
  RequestContext context = 1;
  string object_stream_id = 2;
  uint64 generation = 3;
  ResourceIdentity identity = 4;
  string resource_version = 5;
}

enum ObjectEventType {
  OBJECT_EVENT_TYPE_UNSPECIFIED = 0;
  OBJECT_EVENT_TYPE_UPDATED = 1;
  OBJECT_EVENT_TYPE_DELETED = 2;
  OBJECT_EVENT_TYPE_STATUS = 3;
}

message ObjectEvent {
  StreamCursor cursor = 1;
  ObjectEventType type = 2;
  GetObjectResponse object = 3;
  StructuredError error = 4;
}

message GetRelationshipsRequest {
  RequestContext context = 1;
  ResourceIdentity identity = 2;
  bool include_owners = 3;
  bool include_children = 4;
}

enum RelationshipKind {
  RELATIONSHIP_KIND_UNSPECIFIED = 0;
  RELATIONSHIP_KIND_OWNER = 1;
  RELATIONSHIP_KIND_CHILD = 2;
  RELATIONSHIP_KIND_RELATED = 3;
}

message ResourceRelationship {
  RelationshipKind kind = 1;
  ResourceIdentity identity = 2;
  string label = 3;
  bool stale = 4;
  // The relationship itself matched the requested owner UID, but the source
  // did not provide complete coverage of every Kubernetes resource type.
  bool potentially_incomplete = 5;
}

message GetRelationshipsResponse {
  string request_id = 1;
  repeated ResourceRelationship relationships = 2;
  StructuredError error = 3;
  // True even when no cached children were found: an empty cache result must
  // never be presented as proof that the object has no children.
  bool children_potentially_incomplete = 4;
}

message ScanRelationshipsRequest {
  RequestContext context = 1;
  string scan_id = 2;
  uint64 generation = 3;
  ResourceIdentity identity = 4;
}

message CancelRelationshipScanRequest {
  RequestContext context = 1;
  string scan_id = 2;
  uint64 generation = 3;
}

message RelationshipScanProgress {
  uint32 resources_total = 1;
  uint32 resources_scanned = 2;
  uint64 objects_examined = 3;
  uint32 resources_failed = 4;
  ResourceType current_resource = 5;
  bool complete = 6;
  // A completed scan remains potentially incomplete if discovery or any LIST
  // was denied or failed. Completion means every discovered resource was
  // attempted, not that the API server granted complete visibility.
  bool potentially_incomplete = 7;
}

message RelationshipScanEvent {
  StreamCursor cursor = 1;
  repeated ResourceRelationship relationships = 2;
  RelationshipScanProgress progress = 3;
  // A per-resource failure is non-terminal: scanning continues and the final
  // progress explicitly reports that the result may be incomplete.
  StructuredError warning = 4;
  StructuredError error = 5;
}

enum DataEntryKind {
  DATA_ENTRY_KIND_UNSPECIFIED = 0;
  DATA_ENTRY_KIND_TEXT = 1;
  DATA_ENTRY_KIND_BINARY = 2;
}

// value is intentionally bytes. For Secrets, Go decodes Kubernetes base64
// before sending and re-encodes on mutation. These messages are sensitive and
// must not be logged or persisted by either process.
message DataEntry {
  string key = 1;
  DataEntryKind kind = 2;
  bytes value = 3;
  uint64 byte_size = 4;
  bytes content_hash = 5;
}

message GetDataRequest {
  RequestContext context = 1;
  ResourceIdentity identity = 2;
}

message GetDataResponse {
  string request_id = 1;
  ResourceIdentity identity = 2;
  string resource_version = 3;
  repeated DataEntry entries = 4;
  bool secret = 5;
  StructuredError error = 6;
}
