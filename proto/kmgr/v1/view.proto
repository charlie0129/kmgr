syntax = "proto3";

package kmgr.v1;

import "kmgr/v1/common.proto";

option go_package = "github.com/charlie0129/kmgr/gen/go/kmgr/v1;kmgrv1";
option swift_prefix = "Kmgr_V1_";

service ViewService {
  rpc StreamView(OpenViewRequest) returns (stream ViewEvent);
  rpc FetchViewRange(FetchViewRangeRequest) returns (FetchViewRangeResponse);
  rpc UpdateMetricInterest(UpdateMetricInterestRequest) returns (Acknowledgement);
  rpc ApplySelectionGesture(ApplySelectionGestureRequest) returns (ApplySelectionGestureResponse);
  rpc ProjectSelectionRange(ProjectSelectionRangeRequest) returns (ProjectSelectionRangeResponse);
  rpc FetchSelectionPage(FetchSelectionPageRequest) returns (FetchSelectionPageResponse);
  rpc CancelView(CancelViewRequest) returns (Acknowledgement);
  rpc PreviewColumn(PreviewColumnRequest) returns (PreviewColumnResponse);
  rpc DiscoverOptionalResources(DiscoverOptionalResourcesRequest) returns (DiscoverOptionalResourcesResponse);
  rpc SearchCachedObjects(SearchCachedObjectsRequest) returns (SearchCachedObjectsResponse);
  rpc SearchObjects(SearchObjectsRequest) returns (stream SearchObjectsEvent);
  rpc CancelSearch(CancelSearchRequest) returns (Acknowledgement);
}

// PreviewColumn compiles one draft CEL definition in the authoritative Go
// environment and evaluates it against either the selected object (after a
// fresh UID-pinned GET) or a deterministic, non-sensitive sample object.
message PreviewColumnRequest {
  RequestContext context = 1;
  ResourceType resource = 2;
  NamespaceScope namespace_scope = 3;
  CELColumnDefinition column = 4;
  ResourceIdentity selected_object = 5;
}

message CELColumnDefinition {
  string id = 1;
  string title = 2;
  string expression = 3;
  string result_type = 4;
  string missing = 5;
  string list_joiner = 6;
}

message PreviewColumnResponse {
  string request_id = 1;
  string cel_environment = 2;
  // When evaluation succeeds but the value does not match the draft's
  // declared result type, preview is a display-only raw YAML value and error
  // also carries the validation diagnostic. This lets clients teach from maps
  // and lists without treating them as valid sortable cells.
  Cell preview = 3;
  bool used_sample_object = 4;
  ResourceIdentity evaluated_object = 5;
  StructuredError error = 6;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASCENDING = 1;
  SORT_DIRECTION_DESCENDING = 2;
}

message SortDescriptor {
  string column_id = 1;
  SortDirection direction = 2;
  bool nulls_first = 3;
}

message ViewSpec {
  ResourceType resource = 1;
  NamespaceScope namespace_scope = 2;
  reserved 3, 4;
  reserved "label_selector", "field_selector";
  string filter_expression = 5;
  uint64 filter_revision = 6;
  repeated string column_ids = 7;
  string column_configuration_version = 8;
  repeated SortDescriptor sort = 9;
}

message OpenViewRequest {
  RequestContext context = 1;
  string view_id = 2;
  uint64 generation = 3;
  ViewSpec spec = 4;
  // The client already has a compatible rendered table. The engine must emit
  // ViewReconciled only after an authoritative replacement invalidation is
  // available through FetchViewRange.
  bool stage_until_reconciled = 5;
}

message CancelViewRequest {
  RequestContext context = 1;
  string view_id = 2;
  uint64 generation = 3;
}

enum ViewFreshness {
  VIEW_FRESHNESS_UNSPECIFIED = 0;
  VIEW_FRESHNESS_LOADING = 1;
  VIEW_FRESHNESS_STALE = 2;
  VIEW_FRESHNESS_RESUMING = 3;
  VIEW_FRESHNESS_RELISTING = 4;
  VIEW_FRESHNESS_WATCHING = 5;
  VIEW_FRESHNESS_RECONNECTING = 6;
  VIEW_FRESHNESS_FAILED = 7;
  VIEW_FRESHNESS_COMPLETE = 8;
}

message ViewStatus {
  ViewFreshness freshness = 1;
  uint64 objects_examined = 2;
  uint64 rows_visible = 3;
  int64 last_synchronized_unix_ms = 4;
  bool from_warm_cache = 5;
  string resource_version_hint = 6;
  // True while metric-backed global order or membership is still being
  // completed. Display-only viewport metric refreshes do not set this flag.
  bool metrics_reconciling = 7;
}

// ViewSchema carries resource-specific columns discovered from the same
// Kubernetes stream as the rows. For custom resources these definitions come
// from metav1.Table; no secondary discovery LIST/WATCH is opened.
message ResourceColumnSchema {
  string id = 1;
  string title = 2;
  // Uses the ColumnResultType wire spellings used by columns.yaml.
  string result_type = 3;
  string alignment = 4;
  double width = 5;
  bool default_visible = 6;
  int32 priority = 7;
  string format = 8;
  string description = 9;
}

message ViewSchema {
  repeated ResourceColumnSchema columns = 1;
  bool server_table = 2;
  string revision = 3;
}

// ViewInvalidation announces the exact backend presentation currently
// available through FetchViewRange. The presentation revision advances for
// any cell payload change. The index revision advances only when membership or
// order changes, allowing selection state to remain stable across cell-only
// refreshes. Both revisions are nonzero, generation-local, and monotonically
// increase. An event may repeat both revisions solely to carry new advisory
// optional-resource keys; repeated revisions do not invalidate cached rows.
message ViewInvalidation {
  uint64 presentation_revision = 1;
  uint64 index_revision = 2;
  uint64 rows_visible = 3;
  uint32 max_range_length = 4;
  // Advisory exact Kubernetes ResourceName values newly observed in the raw
  // core/v1 Pod or Node objects. Entries are distinct and sorted. Clients may
  // use them to decide when to repeat cache-only optional resource discovery;
  // the catalog RPC remains authoritative for metadata.
  repeated string observed_optional_resource_keys = 5;
  // True when the advisory key set exceeded its bounded wire budget. Clients
  // should repeat cache-only discovery even if every retained key is known.
  bool observed_optional_resource_keys_truncated = 6;
}

message FetchViewRangeRequest {
  RequestContext context = 1;
  string view_id = 2;
  uint64 generation = 3;
  uint64 presentation_revision = 4;
  uint64 index_revision = 5;
  uint64 start_index = 6;
  uint32 length = 7;
}

message FetchViewRangeResponse {
  string request_id = 1;
  string view_id = 2;
  uint64 generation = 3;
  uint64 presentation_revision = 4;
  uint64 index_revision = 5;
  uint64 start_index = 6;
  uint64 rows_visible = 7;
  repeated ResourceRow rows = 8;
}

// UpdateMetricInterest is a debounced viewport hint. Index revision pins the
// numeric range to one exact ordering; stale hints are rejected rather than
// silently rebound. Swift chooses its visible-range overscan within the
// advertised max_range_length.
message UpdateMetricInterestRequest {
  RequestContext context = 1;
  string view_id = 2;
  uint64 generation = 3;
  uint64 index_revision = 4;
  uint64 start_index = 5;
  uint32 length = 6;
}

// A generation-local commit barrier. The named revisions identify one complete
// authoritative presentation, including the empty case, available through
// FetchViewRange. Clients that requested stage_until_reconciled may replace
// their retained table atomically when this event arrives.
message ViewReconciled {
  uint64 rows_visible = 1;
  uint64 presentation_revision = 2;
  uint64 index_revision = 3;
}

message ViewEvent {
  StreamCursor cursor = 1;
  oneof payload {
    ViewStatus status = 2;
    StructuredError error = 3;
    ViewReconciled reconciled = 4;
    ViewSchema schema = 5;
    ViewInvalidation invalidation = 6;
  }
}

message SearchObjectsRequest {
  RequestContext context = 1;
  string search_id = 2;
  uint64 generation = 3;
  uint64 query_revision = 4;
  ResourceType resource = 5;
  NamespaceScope namespace_scope = 6;
  string query = 7;
  uint32 result_limit = 8;
  bool allow_paginated_list = 9;
}

// SearchCachedObjects is the root Command Palette's strictly local lookup.
// The engine must answer it only from active/warm process-memory stores: it
// never opens a resource client and never performs GET, LIST, or WATCH.
message SearchCachedObjectsRequest {
  RequestContext context = 1;
  NamespaceScope namespace_scope = 2;
  string query = 3;
  uint32 result_limit = 4;
  uint32 examination_limit = 5;
  // Resource kinds matched by the same root-palette query. Objects from these
  // exact GVRs remain relevant even when their names do not contain the kind
  // text (for example, query "pods" and cached Pod "api").
  repeated ResourceType resource_filters = 6;
}

message SearchCachedObjectsResponse {
  string request_id = 1;
  repeated SearchResult results = 2;
  uint64 objects_examined = 3;
  bool examination_truncated = 4;
  StructuredError error = 5;
}

message SearchResult {
  ResourceIdentity identity = 1;
  string display_text = 2;
  string detail_text = 3;
  double rank = 4;
  bool stale = 5;
}

message SearchProgress {
  uint64 query_revision = 1;
  uint64 objects_examined = 2;
  bool complete = 3;
  bool used_direct_get = 4;
  bool reusable_snapshot_available = 5;
}

message SearchObjectsEvent {
  StreamCursor cursor = 1;
  uint64 query_revision = 2;
  repeated SearchResult results = 3;
  SearchProgress progress = 4;
  StructuredError error = 5;
}

message CancelSearchRequest {
  RequestContext context = 1;
  string search_id = 2;
  uint64 generation = 3;
  uint64 query_revision = 4;
}

// DiscoverOptionalResources is a cache-only, point-in-time query. It inspects
// core/v1 Node and Pod objects already retained for this cluster session and
// never opens a resource client or starts a LIST/WATCH or metrics provider.
// Callers run it after base rows are visible and may repeat it as caches fill.
message DiscoverOptionalResourcesRequest {
  RequestContext context = 1;
  ResourceType applicable_resource = 2;
}

enum OptionalResourceCategory {
  OPTIONAL_RESOURCE_CATEGORY_UNSPECIFIED = 0;
  OPTIONAL_RESOURCE_CATEGORY_EPHEMERAL_STORAGE = 1;
  OPTIONAL_RESOURCE_CATEGORY_HUGE_PAGE = 2;
  OPTIONAL_RESOURCE_CATEGORY_ACCELERATOR = 3;
}

message OptionalResource {
  // exact_key is the Kubernetes ResourceName identity. Different keys are
  // never merged even when their display names are equal.
  string exact_key = 1;
  OptionalResourceCategory category = 2;
  // Configured accelerator keys remain in the catalog with present=false so
  // users may opt into an empty exact-resource column deliberately.
  bool present = 3;
  string display_name = 4;
  ResourceType applicable_resource = 5;
  bool explicitly_configured = 6;
}

message DiscoverOptionalResourcesResponse {
  string request_id = 1;
  repeated OptionalResource resources = 2;
  bool nodes_cache_available = 3;
  bool pods_cache_available = 4;
  bool nodes_snapshot_complete = 5;
  bool pods_snapshot_complete = 6;
  bool potentially_incomplete = 7;
  StructuredError error = 8;
}

// Selection tokens are immutable, opaque capabilities scoped to one cluster
// session and logical view. Each gesture produces a new token with a fixed
// expiry; consuming a token never extends that expiry.
enum SelectionGestureKind {
  SELECTION_GESTURE_KIND_UNSPECIFIED = 0;
  SELECTION_GESTURE_KIND_REPLACE = 1;
  SELECTION_GESTURE_KIND_COMMAND_TOGGLE = 2;
  SELECTION_GESTURE_KIND_SHIFT_EXTEND = 3;
  SELECTION_GESTURE_KIND_COMMAND_ALL = 4;
  SELECTION_GESTURE_KIND_CLEAR = 5;
}

message SelectionGesture {
  SelectionGestureKind kind = 1;
  // Absolute row index in the request's generation/index revision. Ignored
  // only by command-all and clear gestures.
  uint64 index = 2;
  // Command-Shift range extension. Invalid for every other gesture kind.
  bool additive = 3;
  // Stable target used when a gesture was made against warm rows while a new
  // ordering was loading. The engine resolves it in the requested current
  // revision; it never trusts the stale numeric index.
  string target_uid = 4;
  // Stable Shift anchor. Valid only with target_uid and SHIFT_EXTEND.
  string anchor_uid = 5;
}

message SelectionAnchor {
  uint64 index = 1;
  string uid = 2;
}

message SelectionState {
  string token = 1;
  uint64 generation = 2;
  uint64 index_revision = 3;
  uint64 selected_count = 4;
  SelectionAnchor anchor = 5;
  int64 expires_at_unix_ms = 6;
}

// ApplySelectionGesture pins numeric input to the complete authoritative
// ordering identified by generation/index_revision. A previous token from a
// different revision remains valid but is not rebound; the gesture starts a
// fresh selection on the requested ordering.
message ApplySelectionGestureRequest {
  RequestContext context = 1;
  string view_id = 2;
  uint64 generation = 3;
  uint64 index_revision = 4;
  string previous_token = 5;
  SelectionGesture gesture = 6;
}

message ApplySelectionGestureResponse {
  string request_id = 1;
  SelectionState selection = 2;
}

// ProjectSelectionRange maps an immutable token to one bounded range of the
// current view by UID. The numeric range is pinned to generation/index_revision
// and is rejected if the current ordering has changed.
message ProjectSelectionRangeRequest {
  RequestContext context = 1;
  string view_id = 2;
  uint64 generation = 3;
  uint64 index_revision = 4;
  uint64 start_index = 5;
  uint32 length = 6;
  string token = 7;
}

message ProjectSelectionRangeResponse {
  string request_id = 1;
  string view_id = 2;
  uint64 generation = 3;
  uint64 index_revision = 4;
  uint64 start_index = 5;
  uint64 rows_visible = 6;
  SelectionState selection = 7;
  repeated bool selected = 8 [packed = true];
  // Offset inside selected when the token's anchor is present in this range.
  optional uint32 anchor_offset = 9;
}

message SelectionPageItem {
  // Absolute index in the immutable ordering retained by the token.
  uint64 pinned_index = 1;
  ResourceIdentity identity = 2;
}

// Offset is a rank in the selected set rather than a table row index. Paging
// remains valid after the source view changes revision or closes.
message FetchSelectionPageRequest {
  RequestContext context = 1;
  string view_id = 2;
  string token = 3;
  uint64 offset = 4;
  uint32 limit = 5;
}

message FetchSelectionPageResponse {
  string request_id = 1;
  SelectionState selection = 2;
  uint64 offset = 3;
  repeated SelectionPageItem items = 4;
  uint64 next_offset = 5;
  bool done = 6;
}
