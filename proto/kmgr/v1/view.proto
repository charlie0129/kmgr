syntax = "proto3";

package kmgr.v1;

import "kmgr/v1/common.proto";

option go_package = "github.com/charlie0129/kmgr/gen/go/kmgr/v1;kmgrv1";
option swift_prefix = "Kmgr_V1_";

service ViewService {
  rpc StreamView(OpenViewRequest) returns (stream ViewEvent);
  rpc CancelView(CancelViewRequest) returns (Acknowledgement);
  rpc PreviewColumn(PreviewColumnRequest) returns (PreviewColumnResponse);
  rpc DiscoverOptionalResources(DiscoverOptionalResourcesRequest) returns (DiscoverOptionalResourcesResponse);
  rpc SearchCachedObjects(SearchCachedObjectsRequest) returns (SearchCachedObjectsResponse);
  rpc SearchObjects(SearchObjectsRequest) returns (stream SearchObjectsEvent);
  rpc CancelSearch(CancelSearchRequest) returns (Acknowledgement);
}

// PreviewColumn compiles one draft CEL definition in the authoritative Go
// environment and evaluates it against either the selected object (after a
// fresh UID-pinned GET) or a deterministic, non-sensitive sample object.
message PreviewColumnRequest {
  RequestContext context = 1;
  ResourceType resource = 2;
  NamespaceScope namespace_scope = 3;
  CELColumnDefinition column = 4;
  ResourceIdentity selected_object = 5;
}

message CELColumnDefinition {
  string id = 1;
  string title = 2;
  string expression = 3;
  string result_type = 4;
  string missing = 5;
  string list_joiner = 6;
}

message PreviewColumnResponse {
  string request_id = 1;
  string cel_environment = 2;
  // When evaluation succeeds but the value does not match the draft's
  // declared result type, preview is a display-only raw YAML value and error
  // also carries the validation diagnostic. This lets clients teach from maps
  // and lists without treating them as valid sortable cells.
  Cell preview = 3;
  bool used_sample_object = 4;
  ResourceIdentity evaluated_object = 5;
  StructuredError error = 6;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASCENDING = 1;
  SORT_DIRECTION_DESCENDING = 2;
}

message SortDescriptor {
  string column_id = 1;
  SortDirection direction = 2;
  bool nulls_first = 3;
}

message ViewSpec {
  ResourceType resource = 1;
  NamespaceScope namespace_scope = 2;
  string label_selector = 3;
  string field_selector = 4;
  string filter_expression = 5;
  uint64 filter_revision = 6;
  repeated string column_ids = 7;
  string column_configuration_version = 8;
  repeated SortDescriptor sort = 9;
}

message OpenViewRequest {
  RequestContext context = 1;
  string view_id = 2;
  uint64 generation = 3;
  ViewSpec spec = 4;
  // The client already has a compatible rendered table. The engine must emit
  // ViewReconciled only after every preceding payload needed to construct one
  // complete replacement presentation has been delivered.
  bool stage_until_reconciled = 5;
}

message CancelViewRequest {
  RequestContext context = 1;
  string view_id = 2;
  uint64 generation = 3;
}

enum ViewFreshness {
  VIEW_FRESHNESS_UNSPECIFIED = 0;
  VIEW_FRESHNESS_LOADING = 1;
  VIEW_FRESHNESS_STALE = 2;
  VIEW_FRESHNESS_RESUMING = 3;
  VIEW_FRESHNESS_RELISTING = 4;
  VIEW_FRESHNESS_WATCHING = 5;
  VIEW_FRESHNESS_RECONNECTING = 6;
  VIEW_FRESHNESS_FAILED = 7;
  VIEW_FRESHNESS_COMPLETE = 8;
}

message ViewStatus {
  ViewFreshness freshness = 1;
  uint64 objects_examined = 2;
  uint64 rows_visible = 3;
  int64 last_synchronized_unix_ms = 4;
  bool from_warm_cache = 5;
  string resource_version_hint = 6;
}

message SnapshotChunk {
  repeated ResourceRow rows = 1;
  bool first_chunk = 2;
  bool last_chunk = 3;
  uint64 chunk_index = 4;
  uint64 estimated_total_rows = 5;
  // Advisory exact Kubernetes ResourceName values newly observed in the raw
  // core/v1 Pod or Node objects behind this snapshot. Entries are distinct and
  // sorted. Clients may use them to decide when to repeat cache-only optional
  // resource discovery; the catalog RPC remains authoritative for metadata.
  repeated string observed_optional_resource_keys = 6;
  // True when the advisory key set exceeded its bounded wire budget. Clients
  // should repeat cache-only discovery even if every retained key is known.
  bool observed_optional_resource_keys_truncated = 7;
}

message RowDelta {
  repeated ResourceRow upserts = 1;
  repeated string removed_uids = 2;
  repeated string ordered_uids = 3;
  bool order_is_complete = 4;
  // Advisory exact Kubernetes ResourceName values newly observed in raw
  // core/v1 Pod or Node upserts. This may be populated even when filtering
  // produces no row upsert. Entries are distinct and sorted.
  repeated string observed_optional_resource_keys = 5;
  // True when the advisory key set exceeded its bounded wire budget. Clients
  // should repeat cache-only discovery even if every retained key is known.
  bool observed_optional_resource_keys_truncated = 6;
}

// A generation-local commit barrier. All snapshot/delta events preceding this
// event form one complete replacement presentation, including the empty case.
// Clients that requested stage_until_reconciled can build those payloads off
// screen and replace their retained table atomically when this event arrives.
message ViewReconciled {
  uint64 rows_visible = 1;
}

message ViewEvent {
  StreamCursor cursor = 1;
  oneof payload {
    SnapshotChunk snapshot = 2;
    RowDelta delta = 3;
    ViewStatus status = 4;
    StructuredError error = 5;
    ViewReconciled reconciled = 6;
  }
}

message SearchObjectsRequest {
  RequestContext context = 1;
  string search_id = 2;
  uint64 generation = 3;
  uint64 query_revision = 4;
  ResourceType resource = 5;
  NamespaceScope namespace_scope = 6;
  string query = 7;
  uint32 result_limit = 8;
  bool allow_paginated_list = 9;
}

// SearchCachedObjects is the root Command Palette's strictly local lookup.
// The engine must answer it only from active/warm process-memory stores: it
// never opens a resource client and never performs GET, LIST, or WATCH.
message SearchCachedObjectsRequest {
  RequestContext context = 1;
  NamespaceScope namespace_scope = 2;
  string query = 3;
  uint32 result_limit = 4;
  uint32 examination_limit = 5;
  // Resource kinds matched by the same root-palette query. Objects from these
  // exact GVRs remain relevant even when their names do not contain the kind
  // text (for example, query "pods" and cached Pod "api").
  repeated ResourceType resource_filters = 6;
}

message SearchCachedObjectsResponse {
  string request_id = 1;
  repeated SearchResult results = 2;
  uint64 objects_examined = 3;
  bool examination_truncated = 4;
  StructuredError error = 5;
}

message SearchResult {
  ResourceIdentity identity = 1;
  string display_text = 2;
  string detail_text = 3;
  double rank = 4;
  bool stale = 5;
}

message SearchProgress {
  uint64 query_revision = 1;
  uint64 objects_examined = 2;
  bool complete = 3;
  bool used_direct_get = 4;
  bool reusable_snapshot_available = 5;
}

message SearchObjectsEvent {
  StreamCursor cursor = 1;
  uint64 query_revision = 2;
  repeated SearchResult results = 3;
  SearchProgress progress = 4;
  StructuredError error = 5;
}

message CancelSearchRequest {
  RequestContext context = 1;
  string search_id = 2;
  uint64 generation = 3;
  uint64 query_revision = 4;
}

// DiscoverOptionalResources is a cache-only, point-in-time query. It inspects
// core/v1 Node and Pod objects already retained for this cluster session and
// never opens a resource client or starts a LIST/WATCH or metrics provider.
// Callers run it after base rows are visible and may repeat it as caches fill.
message DiscoverOptionalResourcesRequest {
  RequestContext context = 1;
  ResourceType applicable_resource = 2;
}

enum OptionalResourceCategory {
  OPTIONAL_RESOURCE_CATEGORY_UNSPECIFIED = 0;
  OPTIONAL_RESOURCE_CATEGORY_EPHEMERAL_STORAGE = 1;
  OPTIONAL_RESOURCE_CATEGORY_HUGE_PAGE = 2;
  OPTIONAL_RESOURCE_CATEGORY_ACCELERATOR = 3;
}

message OptionalResource {
  // exact_key is the Kubernetes ResourceName identity. Different keys are
  // never merged even when their display names are equal.
  string exact_key = 1;
  OptionalResourceCategory category = 2;
  // Configured accelerator keys remain in the catalog with present=false so
  // users may opt into an empty exact-resource column deliberately.
  bool present = 3;
  string display_name = 4;
  ResourceType applicable_resource = 5;
  bool explicitly_configured = 6;
}

message DiscoverOptionalResourcesResponse {
  string request_id = 1;
  repeated OptionalResource resources = 2;
  bool nodes_cache_available = 3;
  bool pods_cache_available = 4;
  bool nodes_snapshot_complete = 5;
  bool pods_snapshot_complete = 6;
  bool potentially_incomplete = 7;
  StructuredError error = 8;
}
